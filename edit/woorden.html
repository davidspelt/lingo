<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Woorden Editor</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --primary: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: var(--card-bg); padding: 16px; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--border); }
    .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-sm { padding: 4px 8px; font-size: 12px; }
    .word-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .word-chip { background: #020617; border: 1px solid var(--border); padding: 6px 10px; border-radius: 999px; display: flex; align-items: center; gap: 6px; }
    .word-input { width: 100%; padding: 8px 10px; margin-top: 6px; background: #020617; color: white; border: 1px solid var(--border); border-radius: 6px; }
    .loading-text { color: #94a3b8; text-align: center; padding: 20px; }
    #status { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
        <h2 style="margin:0;">Woorden Editor</h2>
        <div style="display:flex; gap:8px; flex-wrap: wrap;">
          <a href="index.html" class="btn btn-primary" style="text-decoration:none;">✏️ Quiz Editor</a>
          <a href="../lingo.html" class="btn btn-primary" style="text-decoration:none;">⬅ Terug naar Lingo</a>
        </div>
      </div>
      <label for="gh-token">GitHub Personal Access Token (PAT):</label>
      <input type="password" id="gh-token" placeholder="ghp_..." onchange="saveTokenLocally(this.value)">
    </div>

    <div id="status"></div>
    <div id="editor-app">
      <div class="card loading-text">Woorden laden...</div>
    </div>

    <div style="display:flex; justify-content:space-between; margin-top: 15px; margin-bottom: 30px;">
      <button class="btn btn-primary" onclick="addLengthGroup()">+ Lengte Toevoegen</button>
      <button class="btn btn-success" onclick="saveToGitHub()">💾 Opslaan & Pushen</button>
    </div>
  </div>

  <script src="../shared-teams.js"></script>
  <script>
    const REPO_OWNER = 'davidspelt';
    const REPO_NAME = 'lingo';
    const FILE_PATH = 'woorden.json';
    let wordData = {};
    let currentFileSha = null;

    function saveTokenLocally(val) {
      localStorage.setItem('lingo_gh_token', val.trim());
    }

    function getToken() {
      return document.getElementById('gh-token').value.trim();
    }

    function showStatus(msg, bgColor) {
      const status = document.getElementById('status');
      status.style.display = 'block';
      status.style.background = bgColor;
      status.innerText = msg;
    }

    async function loadData() {
      const savedToken = localStorage.getItem('lingo_gh_token') || '';
      if (savedToken) document.getElementById('gh-token').value = savedToken;

      try {
        const headers = savedToken ? { 'Authorization': `token ${savedToken}` } : {};
        const apiRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, { headers });
        if (apiRes.ok) {
          const meta = await apiRes.json();
          currentFileSha = meta.sha;
          const decoded = decodeURIComponent(escape(atob(meta.content.replace(/\n/g, ''))));
          wordData = JSON.parse(decoded);
        } else {
          const rawRes = await fetch(`https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${FILE_PATH}?cachebust=${Date.now()}`);
          if (rawRes.ok) wordData = await rawRes.json();
          else wordData = { '5': [], '6': [], '10': [] };
        }
      } catch (e) {
        console.error(e);
        wordData = { '5': [], '6': [], '10': [] };
      }

      render();
    }

    function render() {
      const container = document.getElementById('editor-app');
      container.innerHTML = '';

      const lengths = Object.keys(wordData).sort((a, b) => Number(a) - Number(b));
      if (lengths.length === 0) lengths.push('5');

      lengths.forEach(len => {
        const card = document.createElement('div');
        card.className = 'card';
        const items = Array.isArray(wordData[len]) ? wordData[len] : [];
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
            <h3 style="margin:0;">${len} letters</h3>
            <button class="btn btn-danger btn-sm" onclick="removeLengthGroup('${len}')">Verwijderen</button>
          </div>
          <div class="word-list">
            ${items.map((word, idx) => `
              <div class="word-chip">
                <span>${escapeHtml(word)}</span>
                <button class="btn btn-danger btn-sm" onclick="removeWord('${len}', ${idx})">×</button>
              </div>
            `).join('')}
          </div>
          <input class="word-input" id="input-${len}" placeholder="Voeg een woord toe..." onkeydown="if(event.key === 'Enter') addWord('${len}', this.value)">
          <div style="margin-top: 8px;">
            <button class="btn btn-primary btn-sm" onclick="addWord('${len}', document.getElementById('input-${len}').value)">+ Voeg toe</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function addWord(len, value) {
      const word = (value || '').trim().toLowerCase();
      if (!word) return;
      if (!wordData[len]) wordData[len] = [];
      if (!wordData[len].includes(word)) wordData[len].push(word);
      render();
    }

    function removeWord(len, idx) {
      wordData[len].splice(idx, 1);
      render();
    }

    function addLengthGroup() {
      const len = prompt('Aantal letters voor deze groep:');
      if (!len) return;
      const n = Number(len);
      if (!Number.isInteger(n) || n <= 0) return;
      if (!wordData[n]) wordData[n] = [];
      render();
    }

    function removeLengthGroup(len) {
      if (confirm(`Groep ${len} letters verwijderen?`)) {
        delete wordData[len];
        render();
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');
    }

    async function saveToGitHub() {
      const token = getToken();
      if (!token) {
        showStatus('Voer eerst een GitHub PAT in.', '#991b1b');
        return;
      }

      showStatus('Bezig met opslaan...', '#1e3a8a');
      try {
        if (!currentFileSha) {
          const checkRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
            headers: { 'Authorization': `token ${token}` }
          });
          if (checkRes.ok) {
            const meta = await checkRes.json();
            currentFileSha = meta.sha;
          }
        }

        const jsonString = JSON.stringify(wordData, null, 2);
        const base64Content = btoa(unescape(encodeURIComponent(jsonString)));
        const bodyData = { message: 'Update woorden via editor', content: base64Content };
        if (currentFileSha) bodyData.sha = currentFileSha;

        const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify(bodyData)
        });

        if (response.ok) {
          const resData = await response.json();
          currentFileSha = resData.content.sha;
          showStatus('Succes! Woorden opgeslagen.', '#065f46');
        } else {
          const err = await response.json();
          throw new Error(err.message || 'API error');
        }
      } catch (e) {
        showStatus('Opslaan mislukt: ' + e.message, '#991b1b');
      }
    }

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
