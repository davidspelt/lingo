<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lingo Editor</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --primary: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
    .container { max-width: 700px; margin: 0 auto; }
    .card { background: var(--card-bg); padding: 16px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border); position: relative; }
    label { display: block; margin-top: 8px; font-weight: 600; font-size: 14px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 10px; margin-top: 6px; background: #020617; border: 1px solid var(--border);
      color: var(--text); border-radius: 4px; box-sizing: border-box;
    }
    .btn { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-sm { padding: 4px 8px; font-size: 12px; margin-top: 0; }
    #status { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>Lingo Quiz Editor</h2>
    <label>GitHub Personal Access Token (PAT):</label>
    <input type="password" id="gh-token" placeholder="github_pat_..." onchange="saveTokenLocally(this.value)">
    <p style="font-size: 12px; color: #94a3b8; margin-top: 4px;">Saved in browser local storage. Never committed to GitHub or shared.</p>
  </div>

  <div id="status"></div>
  <div id="questions-list"></div>

  <div style="display:flex; justify-content:space-between; margin-top: 15px;">
    <button class="btn btn-primary" onclick="addQuestion()">+ Add Question</button>
    <button class="btn btn-success" onclick="saveToGitHub()">Save & Push to GitHub</button>
  </div>
</div>

<script>
  const REPO_OWNER = 'davidspelt';
  const REPO_NAME = 'lingo';
  const FILE_PATH = 'quiz.json';

  let quizData = { questions: [] };
  let currentFileSha = null;

  function saveTokenLocally(val) {
    localStorage.setItem('lingo_gh_token', val.trim());
  }

  function getToken() {
    return document.getElementById('gh-token').value.trim();
  }

  async function loadData() {
    const savedToken = localStorage.getItem('lingo_gh_token') || '';
    if (savedToken) document.getElementById('gh-token').value = savedToken;

    try {
      const headers = {};
      if (savedToken) headers['Authorization'] = `token ${savedToken}`;

      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, { headers });
      if (res.ok) {
        const meta = await res.json();
        currentFileSha = meta.sha;
        const decoded = decodeURIComponent(escape(atob(meta.content.replace(/\n/g, ''))));
        quizData = JSON.parse(decoded);
      } else {
        quizData = { questions: [] };
      }
    } catch (e) {
      console.error('Failed to fetch file:', e);
      quizData = { questions: [] };
    }
    render();
  }

  function render() {
    const list = document.getElementById('questions-list');
    list.innerHTML = '';
    quizData.questions.forEach((q, qIdx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <button class="btn btn-danger btn-sm" style="position: absolute; right: 16px; top: 16px;" onclick="removeQuestion(${qIdx})">Delete</button>
        <label>Question ${qIdx + 1}</label>
        <input type="text" value="${escapeHtml(q.question)}" oninput="quizData.questions[${qIdx}].question = this.value">
      `;
      list.appendChild(card);
    });
  }

  function addQuestion() {
    quizData.questions.push({ question: "New Question", options: [], answer: 0 });
    render();
  }

  function removeQuestion(idx) {
    quizData.questions.splice(idx, 1);
    render();
  }

  function escapeHtml(str) {
    return (str || '').replace(/"/g, '&quot;');
  }

  async function saveToGitHub() {
    const token = getToken();
    const status = document.getElementById('status');
    status.style.display = 'block';

    if (!token) {
      status.style.background = '#991b1b';
      status.innerText = 'Please enter a valid GitHub token.';
      return;
    }

    status.style.background = '#1e3a8a';
    status.innerText = 'Pushing update directly to GitHub...';

    try {
      const jsonString = JSON.stringify(quizData, null, 2);
      const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

      const bodyData = {
        message: 'Update quiz.json from Lingo Editor',
        content: base64Content
      };
      if (currentFileSha) bodyData.sha = currentFileSha;

      const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json'
        },
        body: JSON.stringify(bodyData)
      });

      if (response.ok) {
        const resData = await response.json();
        currentFileSha = resData.content.sha;
        status.style.background = '#065f46';
        status.innerText = 'Success! GitHub Pages will auto-republish in ~1 minute.';
      } else {
        const err = await response.json();
        throw new Error(err.message || 'API error');
      }
    } catch (e) {
      status.style.background = '#991b1b';
      status.innerText = 'Failed: ' + e.message;
    }
  }

  document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
